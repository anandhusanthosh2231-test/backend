openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for AI Recipes, an Indian-first library of practical AI workflows.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
  - name: discovery
  - name: engagement
  - name: submissions
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: Search and filter published recipes
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: audience, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, popular, newest] } }
        - { name: page, in: query, schema: { type: number, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: number, minimum: 1, maximum: 50, default: 12 } }
      responses:
        "200":
          description: Recipe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
  /recipes/{slug}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a recipe by slug
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404":
          description: Recipe not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /recipes/{slug}/related:
    get:
      operationId: getRelatedRecipes
      tags: [recipes]
      summary: Get related published recipes
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: number, minimum: 1, maximum: 6, default: 3 } }
      responses:
        "200":
          description: Related recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeCard" }
  /home:
    get:
      operationId: getHome
      tags: [discovery]
      summary: Get homepage discovery content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }
  /categories:
    get:
      operationId: listCategories
      tags: [discovery]
      summary: List recipe categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /categories/{slug}:
    get:
      operationId: getCategory
      tags: [discovery]
      summary: Get category details and recipes
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionResponse" }
  /audiences:
    get:
      operationId: listAudiences
      tags: [discovery]
      summary: List recipe audiences
      responses:
        "200":
          description: Audiences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Audience" }
  /audiences/{slug}:
    get:
      operationId: getAudience
      tags: [discovery]
      summary: Get audience details and recipes
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionResponse" }
  /events:
    post:
      operationId: trackEvent
      tags: [engagement]
      summary: Track a lightweight product event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "204": { description: Event accepted }
  /feedback:
    post:
      operationId: submitFeedback
      tags: [engagement]
      summary: Submit recipe feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /suggestions:
    post:
      operationId: submitSuggestion
      tags: [submissions]
      summary: Suggest a recipe for a missing search need
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionInput" }
      responses:
        "201":
          description: Suggestion saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit an AI workflow for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionInput" }
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /me:
    get:
      operationId: getMe
      tags: [engagement]
      summary: Get signed-in profile summary
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { description: Authentication required }
  /me/saved:
    get:
      operationId: listSavedRecipes
      tags: [engagement]
      summary: List the signed-in user's saved recipes
      responses:
        "200":
          description: Saved recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeCard" }
        "401": { description: Authentication required }
  /me/saved/{recipeId}:
    post:
      operationId: saveRecipe
      tags: [engagement]
      summary: Save a recipe
      parameters:
        - { name: recipeId, in: path, required: true, schema: { type: number } }
      responses:
        "201": { description: Recipe saved }
        "401": { description: Authentication required }
    delete:
      operationId: unsaveRecipe
      tags: [engagement]
      summary: Remove a saved recipe
      parameters:
        - { name: recipeId, in: path, required: true, schema: { type: number } }
      responses:
        "204": { description: Recipe unsaved }
        "401": { description: Authentication required }
  /me/history:
    get:
      operationId: listHistory
      tags: [engagement]
      summary: List recently viewed recipes
      responses:
        "200":
          description: Recently viewed recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeCard" }
        "401": { description: Authentication required }
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get dashboard metrics
      responses:
        "200":
          description: Admin metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/recipes:
    get:
      operationId: listAdminRecipes
      tags: [admin]
      summary: List recipes for admin
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: number, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Admin recipe list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
    post:
      operationId: createAdminRecipe
      tags: [admin]
      summary: Create an admin recipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
  /admin/recipes/import-csv:
    post:
      operationId: importAdminRecipesCsv
      tags: [admin]
      summary: Import recipes from a CSV spreadsheet
      description: >-
        Imports up to 500 recipe rows. Headers are matched case-insensitively to
        the AI Recipes spreadsheet columns. List cells may use commas,
        semicolons, pipes, line breaks, or JSON arrays. Recipes default to DRAFT
        unless Publishing Status explicitly says Published or Live.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportAdminRecipesBody" }
      responses:
        "200":
          description: Per-row import results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportAdminRecipesResponse" }
        "400": { description: Invalid CSV or import size }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/recipes/{id}:
    patch:
      operationId: updateAdminRecipe
      tags: [admin]
      summary: Update an admin recipe
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeUpdate" }
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
    delete:
      operationId: deleteAdminRecipe
      tags: [admin]
      summary: Delete an admin recipe
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204": { description: Recipe deleted }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Recipe not found }
  /admin/recipes/{id}/duplicate:
    post:
      operationId: duplicateAdminRecipe
      tags: [admin]
      summary: Duplicate a recipe as a draft
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "201":
          description: Duplicated recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
  /admin/recipes/generate-draft:
    post:
      operationId: generateDraftRecipe
      tags: [admin]
      summary: Generate a structured recipe draft from an idea or prompt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateDraftInput" }
      responses:
        "200":
          description: Generated draft recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeInput" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/submissions:
    get:
      operationId: listAdminSubmissions
      tags: [admin]
      summary: Review user submissions
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
  /admin/submissions/{id}:
    patch:
      operationId: updateAdminSubmission
      tags: [admin]
      summary: Update status of a submission
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionStatusUpdate" }
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Submission not found }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get content and search analytics
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    Category:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        recipeCount: { type: number }
      required: [id, name, slug, description, recipeCount]
    Audience:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        recipeCount: { type: number }
      required: [id, name, slug, description, recipeCount]
    RecipeCard:
      type: object
      properties:
        id: { type: number }
        title: { type: string }
        slug: { type: string }
        shortDescription: { type: string }
        category: { type: string }
        categorySlug: { type: string }
        audience: { type: string }
        audienceSlug: { type: string }
        difficulty: { type: string }
        estimatedTime: { type: string }
        language: { type: string }
        tags:
          type: array
          items: { type: string }
        featured: { type: boolean }
        trending: { type: boolean }
        viewCount: { type: number }
        copyCount: { type: number }
        saveCount: { type: number }
      required: [id, title, slug, shortDescription, category, categorySlug, audience, audienceSlug, difficulty, estimatedTime, language, tags, featured, trending, viewCount, copyCount, saveCount]
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeCard"
        - type: object
          properties:
            problem: { type: string }
            subcategory: { type: string }
            aiTools:
              type: array
              items: { type: string }
            requiredInputs:
              type: array
              items: { type: string }
            steps:
              type: array
              items: { type: string }
            prompt: { type: string }
            exampleInput: { type: string }
            exampleOutput: { type: string }
            refinementPrompts:
              type: array
              items: { type: string }
            verificationNotes: { type: string }
            status: { type: string }
            version: { type: string }
            testedAt: { type: ["string", "null"], format: date }
            testedWith:
              type: array
              items: { type: string }
            seoTitle: { type: string }
            seoDescription: { type: string }
            updatedAt: { type: string, format: date-time }
            publishedAt: { type: ["string", "null"], format: date-time }
            guide:
              oneOf:
                - $ref: "#/components/schemas/RecipeGuide"
                - type: "null"
          required: [problem, subcategory, aiTools, requiredInputs, steps, prompt, exampleInput, exampleOutput, refinementPrompts, verificationNotes, status, version, testedWith, seoTitle, seoDescription]
    RecipeInput:
      type: object
      properties:
        title: { type: string, minLength: 3 }
        slug: { type: string, minLength: 3 }
        shortDescription: { type: string, minLength: 10 }
        problem: { type: string, minLength: 10 }
        categoryId: { type: number }
        audienceId: { type: number }
        subcategory: { type: string }
        difficulty: { type: string }
        estimatedTime: { type: string }
        language: { type: string }
        aiTools: { type: array, items: { type: string } }
        requiredInputs: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        prompt: { type: string, minLength: 20 }
        exampleInput: { type: string }
        exampleOutput: { type: string }
        refinementPrompts: { type: array, items: { type: string } }
        verificationNotes: { type: string }
        tags: { type: array, items: { type: string } }
        status: { type: string }
        featured: { type: boolean }
        trending: { type: boolean }
        recipeOfDay: { type: boolean }
        version: { type: string }
        testedAt: { type: ["string", "null"], format: date }
        testedWith: { type: array, items: { type: string } }
        seoTitle: { type: string }
        seoDescription: { type: string }
        guide: { $ref: "#/components/schemas/RecipeGuide" }
      required: [title, slug, shortDescription, problem, categoryId, audienceId, subcategory, difficulty, estimatedTime, language, aiTools, requiredInputs, steps, prompt, exampleInput, exampleOutput, refinementPrompts, verificationNotes, tags, status, featured, trending, recipeOfDay, version, testedWith, seoTitle, seoDescription]
    ImportAdminRecipesBody:
      type: object
      properties:
        csv: { type: string, maxLength: 5242880 }
      required: [csv]
    ImportAdminRecipesResponse:
      type: object
      properties:
        createdCount: { type: integer }
        failedCount: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              slug: { type: string }
              status: { type: string, enum: [created, failed] }
              message: { type: string }
            required: [row, slug, status, message]
      required: [createdCount, failedCount, results]
    RecipeUpdate:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
      description: Full replacement payload for an admin recipe.
    RecipeListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RecipeCard" } }
        page: { type: number }
        pageSize: { type: number }
        total: { type: number }
        query: { type: string }
      required: [items, page, pageSize, total, query]
    CollectionResponse:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        recipes: { type: array, items: { $ref: "#/components/schemas/RecipeCard" } }
      required: [name, slug, description, recipes]
    HomeResponse:
      type: object
      properties:
        recipeOfDay: { type: ["object", "null"], allOf: [{ $ref: "#/components/schemas/RecipeCard" }] }
        trending: { type: array, items: { $ref: "#/components/schemas/RecipeCard" } }
        popular: { type: array, items: { $ref: "#/components/schemas/RecipeCard" } }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        audiences: { type: array, items: { $ref: "#/components/schemas/Audience" } }
      required: [trending, popular, categories, audiences]
    EventInput:
      type: object
      properties:
        type: { type: string, enum: [page_view, recipe_view, recipe_copy, recipe_save, recipe_unsave, recipe_share, recipe_feedback_positive, recipe_feedback_negative, recipe_tool_click, recipe_example_view, recipe_prompt_run, recipe_feedback, recipe_refinement_click, search, recipe_submission] }
        recipeId: { type: ["integer", "null"] }
        query: { type: ["string", "null"], maxLength: 200 }
        metadata:
          type: ["object", "null"]
          properties:
            category: { type: string, maxLength: 100 }
            tool: { type: string, maxLength: 100 }
            example: { type: string, maxLength: 100 }
            refinement: { type: string, maxLength: 200 }
      required: [type]
    RecipeGuide:
      type: object
      properties:
        snapshot:
          type: object
          properties:
            bestFor: { type: string }
            worksBestWhen: { type: string }
            timeToResult: { type: string }
            output: { type: string }
            bestWith: { type: array, items: { type: string } }
            skillLevel: { type: string }
        useCases:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
            required: [name, description]
        whenNotToUse:
          type: array
          items: { type: string }
        inputs:
          type: object
          properties:
            required: { type: array, items: { type: string } }
            optional: { type: array, items: { type: string } }
        situations:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              promptModifier: { type: string }
            required: [name, promptModifier]
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              support: { type: string, enum: [compatible, good, excellent] }
              notes: { type: string }
            required: [name, support]
        promptVariables:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              placeholder: { type: string }
              required: { type: boolean }
            required: [name, label]
        expectedOutput:
          type: object
          properties:
            description: { type: string }
            characteristics: { type: array, items: { type: string } }
        examples:
          type: array
          items:
            type: object
            properties:
              scenario: { type: string }
              input: { type: string }
              output: { type: string }
              whyItWorks: { type: array, items: { type: string } }
            required: [scenario, input, output]
        bestFor:
          type: object
          properties:
            people: { type: array, items: { type: string } }
            tasks: { type: array, items: { type: string } }
            channels: { type: array, items: { type: string } }
        timeToResult: { type: string }
        effort: { type: string }
        typicalIterations: { type: string }
        commonMistakes: { type: array, items: { type: string } }
        betterApproach: { type: string }
        proTips: { type: array, items: { type: string } }
        safetyNotes: { type: array, items: { type: string } }
        quality:
          type: object
          properties:
            status: { type: string, enum: [untested, in_testing, tested] }
            lastTested: { type: ["string", "null"], format: date }
            version: { type: string }
            testedWith: { type: array, items: { type: string } }
    FeedbackInput:
      type: object
      properties:
        recipeId: { type: number }
        helpful: { type: boolean }
        note: { type: ["string", "null"], maxLength: 1000 }
      required: [recipeId, helpful]
    SuggestionInput:
      type: object
      properties:
        query: { type: string, minLength: 2, maxLength: 200 }
      required: [query]
    SubmissionInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        problem: { type: string, minLength: 10, maxLength: 2000 }
        workflow: { type: string, minLength: 20, maxLength: 10000 }
        howUsed: { type: string, minLength: 10, maxLength: 2000 }
        email: { type: ["string", "null"], format: email }
      required: [title, problem, workflow, howUsed]
    GenerateDraftInput:
      type: object
      properties:
        topicOrPrompt: { type: string, minLength: 3 }
        category: { type: string }
        audience: { type: string }
      required: [topicOrPrompt]
    SubmissionStatusUpdate:
      type: object
      properties:
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CONVERTED] }
      required: [status]
    Profile:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: ["string", "null"] }
        savedCount: { type: number }
        historyCount: { type: number }
      required: [userId, displayName, savedCount, historyCount]
    Submission:
      type: object
      properties:
        id: { type: number }
        title: { type: string }
        problem: { type: string }
        workflow: { type: string }
        howUsed: { type: string }
        email: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, title, problem, workflow, howUsed, status, createdAt]
    AdminSummary:
      type: object
      properties:
        totalRecipes: { type: number }
        publishedRecipes: { type: number }
        draftRecipes: { type: number }
        testingRecipes: { type: number }
        views: { type: number }
        copies: { type: number }
        saves: { type: number }
        shares: { type: number }
        positiveFeedback: { type: number }
        negativeFeedback: { type: number }
        pendingSubmissions: { type: number }
      required: [totalRecipes, publishedRecipes, draftRecipes, testingRecipes, views, copies, saves, shares, positiveFeedback, negativeFeedback, pendingSubmissions]
    AnalyticsResponse:
      type: object
      properties:
        popularSearches:
          type: array
          items:
            type: object
            properties:
